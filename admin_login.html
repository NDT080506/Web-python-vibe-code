<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khu Vực Quản Trị Bí Mật</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background: #1c1917;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .lock-card {
            width: 100%;
            max-width: 390px;
            background: #292524;
            border: 1px solid #44403c;
            border-radius: 22px;
            padding: 36px 28px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }
        .lock-icon {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            background: #44403c;
            border: 1px solid #57534e;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d97706;
            margin: 0 auto 16px auto;
        }
        h2 { color: #f5f5f4; font-size: 1.3rem; font-weight: 800; margin-bottom: 6px; }
        p { color: #a8a29e; font-size: 0.88rem; margin-bottom: 24px; }
        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.86rem;
            font-weight: 600;
            margin-bottom: 20px;
        }
        input[type="password"] {
            width: 100%;
            background: #1c1917;
            border: 1.5px solid #57534e;
            border-radius: 12px;
            padding: 14px;
            font-size: 1.2rem;
            color: #ffffff;
            text-align: center;
            letter-spacing: 0.3em;
            outline: none;
            margin-bottom: 20px;
            transition: all 0.2s;
        }
        input[type="password"]:focus {
            border-color: #d97706;
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.2);
        }
        .btn-unlock {
            width: 100%;
            background: #d97706;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-size: 0.96rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-unlock:hover { background: #b45309; }
        .back-home {
            display: inline-block;
            margin-top: 18px;
            color: #78716c;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .back-home:hover { color: #a8a29e; }
    </style>
</head>
<body>
    <div class="lock-card">
        <div class="lock-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        <h2>Khu Vực Quản Trị</h2>
        <p>Nhập mã PIN bảo mật để xem cơ sở dữ liệu SQLite.</p>

        {% if error %}
            <div class="alert-error">{{ error }}</div>
        {% endif %}

        <form action="{{ url_for('admin_database') }}" method="POST">
            <input type="password" name="pin" placeholder="••••" maxlength="8" autofocus required>
            <button type="submit" class="btn-unlock">Mở Khóa Quản Trị</button>
        </form>

        <a href="{{ url_for('index') }}" class="back-home">← Quay lại trang công khai</a>
    </div>
</body>
</html>
